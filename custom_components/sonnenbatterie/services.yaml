set_em_operating_mode:
  name: Set EM Operating Mode
  description: >
    Setzt den Betriebsmodus der sonnenBatterie.
    Unterstützte Modi:
      - 1 = Manuell
      - 2 = Eigenverbrauchsoptimierung
      - 6 = Erweiterungsmodus
      - 10 = Time Of Use
      - 11 = Automatic optimization
  fields:
    entity_id:
      name: Batterie
      description: Eine Entität der gewünschten Batterie. Bei mehreren Batterien erforderlich.
      selector:
        entity:
          filter:
            integration: sonnenbatterie
    mode:
      name: Modus
      description: >
        Der gewünschte Betriebsmodus (1, 2, 6, 10 oder 11). Für sB10h Modus 11 statt Modus 2 verwenden.
      required: true
      example: 2
      selector:
        select:
          options:
            - label: Manuell
              value: "1"
            - label: Eigenverbrauchsoptimierung
              value: "2"
            - label: Erweiterungsmodus
              value: "6"
            - label: Time Of Use
              value: "10"
            - label: Automatic optimization
              value: "11"


set_battery_power:
  name: Set Battery Power
  description: >
    Setzt die Lade- oder Entladeleistung der sonnenBatterie in Watt.
    Außerhalb des manuellen Betriebsmodus zeitlich begrenzt (standardmäßig 30 Sekunden). VPP kann den Befehl ablehnen. Bei Hybridgeräten beeinflusst die PV-Leistung den resultierenden Batteriefluss.
  fields:
    entity_id:
      name: Batterie
      description: Eine Entität der gewünschten Batterie. Bei mehreren Batterien erforderlich.
      selector:
        entity:
          filter:
            integration: sonnenbatterie
    direction:
      name: Richtung
      description: >
        Richtung des Energieflusses:
          - charge = Laden
          - discharge = Entladen
      required: true
      example: discharge
      selector:
        select:
          options:
            - label: Laden
              value: charge
            - label: Entladen
              value: discharge

    watts:
      name: Leistung
      description: >
        Leistung in Watt, die geladen oder entladen werden soll.
        Maximalleistung richtet sich nach dem installierten Inverter.
      required: true
      example: 1500
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: W


publish_all_sensors:
  name: Publish all sensors
  description: Emit current states of loaded sonnenBatterie entities as events.

set_site_setpoint:
  name: Site AC Setpoint
  description: "Zeitlich begrenzter AC-Sollwert. Positiv = Bezug, negativ = Abgabe. Null ist ein aktiver Sollwert, kein Abbrechen. Erfordert unterstützte Site-API/EM2."
  fields:
    entity_id:
      name: Batterie
      selector:
        entity:
          filter:
            integration: sonnenbatterie
    duration:
      name: Dauer
      description: Gültigkeit in ganzen Sekunden, standardmäßig 30.
      default: 30
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    watts:
      name: AC-Sollwert
      required: true
      selector:
        number:
          min: -2147483648
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: W

set_site_limits:
  name: Site Power Limits
  description: "Zeitlich begrenzte Limits. Mindestens ein Limit angeben. Null bedeutet Grenze null. Erfordert unterstützte Site-API/EM2."
  fields:
    entity_id:
      name: Batterie
      selector:
        entity:
          filter:
            integration: sonnenbatterie
    duration:
      name: Dauer
      description: Gültigkeit in ganzen Sekunden, standardmäßig 30.
      default: 30
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    i_bess_storage_max_charge_limit:
      name: Maximaler Ladestrom
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: A
    i_bess_storage_max_discharge_limit:
      name: Maximaler Entladestrom
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: A
    p_bess_inv_max_export_limit:
      name: Maximale Wechselrichterabgabe
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: W
    p_bess_inv_max_import_limit:
      name: Maximaler Wechselrichterbezug
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: W
    p_gcp_max_export_limit:
      name: Maximale Netzeinspeisung
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: W
    p_gcp_max_import_limit:
      name: Maximaler Netzbezug
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          step: 1
          mode: box
          unit_of_measurement: W
